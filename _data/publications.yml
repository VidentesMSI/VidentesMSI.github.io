- citation: 'Helen Davies. *Illuminating the Past: A Summer Institute on Multispectral Imaging and Cultural Heritage Preservation*. National Endowment for the Humanities, Office of Digital Humanities. $250,000. 2024.'
  doi:
  link: https://www.neh.gov/blog/announcing-new-odh-awards-august-2024
  date: 2024-09-05
  type: Grants
  description: >
     This 250,000 grant by the National Endowment for the Humanities would have funded the 2025 _Illuminating the Past: A Summer Institute on Multispectral Imaging and Cultural Heritage Preservation_. _Illuminating the Past_ is a professional development institute to educate participants on multispectral imaging and related methods to enhance analysis of humanities collections. The institute was initiall set to be held in collaboration with Videntes and UCCS’ Digital History Center but the grant was cancelled in April 2025 by DOGE. The grant was reinstated in October 2026 but has not yet been revised for a new timeline.
