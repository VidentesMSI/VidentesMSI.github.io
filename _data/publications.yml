- citation: 'Aleksandra Buncic, Catherine Albers-Morris, and Gregory Heyworth. "Multispectral Imaging to Recover Lost Text in the Sarajevo Haggadah." *Journal of Cultural Heritage* 67 (2024): 284–89.'
  doi: https://doi.org/10.1016/j.culher.2024.03.015
  link:
  date: 2024-04-02
  type: Articles
  description: >
     This article describes the process of using MSI to image the Sarajevo Haggadah, a Spanish illuminated manuscript that followed Jews expelled from Spain in the 14th century. The MSI project has revealed a complete text of a sale contract that had been erased.

